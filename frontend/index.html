<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loader</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="window-frame">
        <div class="drag-strip"></div>
        <div id="loaderFill" class="loader-fill" aria-hidden="true"></div>
        <div id="doneMessage" class="done-message" aria-live="polite">Done. Open csgo</div>

        <div class="window-controls">
          <button id="minimizeButton" class="control-btn" aria-label="Minimize">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 12h12" />
            </svg>
          </button>
          <button id="closeButton" class="control-btn close" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 7l10 10M17 7L7 17" />
            </svg>
          </button>
        </div>

        <aside class="sidebar">
          <div class="brand-mark">NL</div>

          <nav class="menu-list" aria-label="sections">
            <span class="menu-item menu-item-active menu-item-with-icon">
              <span class="game-icon" aria-hidden="true">
                <img id="gameIconImage" class="game-icon-image" alt="" hidden />
                <svg id="gameIconFallback" viewBox="0 0 24 24" role="img" aria-hidden="true">
                  <circle cx="12" cy="12" r="5.25" fill="none" stroke="currentColor" stroke-width="1.7" />
                  <circle cx="12" cy="12" r="1.35" fill="currentColor" />
                  <path
                    d="M12 3.4v3.1M12 17.5v3.1M3.4 12h3.1M17.5 12h3.1"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                  />
                </svg>
              </span>
              <span>CS:GO</span>
            </span>
          </nav>

          <div class="side-footer">
            <span class="telegram-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M20.8 4.7 17.9 19c-.2 1-.8 1.2-1.6.8l-4.4-3.2-2.1 2c-.2.2-.4.4-.9.4l.3-4.5 8.2-7.4c.4-.3-.1-.5-.5-.2L6.8 13.3 2.4 12c-1-.3-1-1  .2-1.4L19.7 4c.8-.3 1.5.2 1.1.7Z" />
              </svg>
            </span>
            <div class="profile-text">
              <a id="telegramLink" class="profile-name" href="https://t.me/nlcsgofix" target="_blank" rel="noreferrer">
                t.me/nlcsgofix
              </a>
              <p class="profile-status">Lifetime</p>
            </div>
          </div>
        </aside>

        <section class="workspace">
          <div class="terminal-loader">
            <p id="statusText" class="runtime-status" aria-live="polite"></p>
            <button id="launchButton" class="launch-button" type="button">
              <span>Launch</span>
            </button>
          </div>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
